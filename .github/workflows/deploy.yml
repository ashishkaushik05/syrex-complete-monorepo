name: CI + Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── 1. Backend: TypeScript check ──────────────────────────────────────────
  backend-check:
    name: Backend — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install deps
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          echo '{"name":"syrex-root","version":"1.0.0"}' > package.json
          backend/node_modules/.bin/prisma generate --schema schema.prisma
          rm package.json

      - name: Typecheck
        working-directory: backend
        run: bun run typecheck

  # ── 2. Web: build + lint ──────────────────────────────────────────────────
  web-check:
    name: Web — build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          VITE_API_URL: https://strideit.syrexbatteries.in
        run: npm run build

      - name: Lint
        working-directory: web
        run: npm run lint

  # ── 3. Deploy: only when both CI jobs pass ────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-check, web-check]
    if: needs.backend-check.result == 'success' && needs.web-check.result == 'success'
    steps:
      - name: SSH deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -p 2222 \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            ashish@45.195.159.172 \
            'bash /srv/syrex-api/scripts/deploy.sh'
          rm /tmp/deploy_key
