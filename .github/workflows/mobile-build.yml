name: Mobile Build

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        default: 'sales_mobile_app'
        type: choice
        options:
          - sales_mobile_app
          - outlet_owner_template
      platform:
        description: 'Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android

env:
  FLUTTER_VERSION: '3.32.0'
  API_BASE_URL: 'https://strideit.syrexbatteries.in/trpc'
  APP_ENV: 'prod'

jobs:
  android-sales:
    name: Android — sales_mobile_app
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.app == 'sales_mobile_app')

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        working-directory: mobile/sales_mobile_app/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

      - name: Write key.properties
        working-directory: mobile/sales_mobile_app/android
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            '${{ secrets.ANDROID_STORE_PASSWORD }}' \
            '${{ secrets.ANDROID_KEY_PASSWORD }}' \
            '${{ secrets.ANDROID_KEY_ALIAS }}' > key.properties

      - run: flutter pub get
        working-directory: mobile/sales_mobile_app

      - name: Build AAB
        working-directory: mobile/sales_mobile_app
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=${{ env.APP_ENV }} \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: sales-app-${{ github.sha }}
          path: mobile/sales_mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  android-outlet:
    name: Android — outlet_owner_template
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.app == 'outlet_owner_template')

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        working-directory: mobile/outlet_owner_template/android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

      - name: Write key.properties
        working-directory: mobile/outlet_owner_template/android
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            '${{ secrets.ANDROID_STORE_PASSWORD }}' \
            '${{ secrets.ANDROID_KEY_PASSWORD }}' \
            '${{ secrets.ANDROID_KEY_ALIAS }}' > key.properties

      - run: flutter pub get
        working-directory: mobile/outlet_owner_template

      - name: Build AAB
        working-directory: mobile/outlet_owner_template
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=${{ env.APP_ENV }} \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: outlet-app-${{ github.sha }}
          path: mobile/outlet_owner_template/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # service_mobile_app: no android/ directory yet (scaffold only).
  # Add job here once flutter create android platform is run.
