name: Mobile Build

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        default: 'sales_mobile_app'
        type: choice
        options:
          - sales_mobile_app
          - outlet_owner_template
      platform:
        description: 'Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios

env:
  FLUTTER_VERSION: '3.32.0'
  API_BASE_URL: 'https://strideit.syrexbatteries.in/trpc'
  APP_ENV: 'prod'

jobs:
  # ─── Android builds ──────────────────────────────────────────────────────────
  android-sales:
    name: Android — sales_mobile_app
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == 'sales_mobile_app' && github.event.inputs.platform == 'android')

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        working-directory: mobile/sales_mobile_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks

      - name: Write key.properties
        working-directory: mobile/sales_mobile_app/android
        run: |
          cat > key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Flutter pub get
        working-directory: mobile/sales_mobile_app
        run: flutter pub get

      - name: Flutter build AAB
        working-directory: mobile/sales_mobile_app
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=${{ env.APP_ENV }} \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-app-release-${{ github.sha }}
          path: mobile/sales_mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  android-outlet:
    name: Android — outlet_owner_template
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.app == 'outlet_owner_template' && github.event.inputs.platform == 'android')

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        working-directory: mobile/outlet_owner_template/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks

      - name: Write key.properties
        working-directory: mobile/outlet_owner_template/android
        run: |
          cat > key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Flutter pub get
        working-directory: mobile/outlet_owner_template
        run: flutter pub get

      - name: Flutter build AAB
        working-directory: mobile/outlet_owner_template
        run: |
          flutter build appbundle --release \
            --dart-define=APP_ENV=${{ env.APP_ENV }} \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: outlet-app-release-${{ github.sha }}
          path: mobile/outlet_owner_template/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # service_mobile_app has no android/ directory yet (scaffold only).
  # Add its build job here once the Android platform is initialised.
