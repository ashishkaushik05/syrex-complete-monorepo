name: outlet_app
description: Syrex Outlet Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.5

  # HTTP / API
  dio: ^5.4.3+1

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Fonts
  google_fonts: ^6.2.1

  # Localisation / formatting
  intl: ^0.19.0

  # Deep links / tap-to-call
  url_launcher: ^6.3.0

  # Network connectivity
  connectivity_plus: ^6.1.1

  # Animation
  flutter_animate: ^4.5.0

  # PDF generation & sharing
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
