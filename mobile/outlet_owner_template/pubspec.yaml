name: outlet_owner_template
description: "Reusable Outlet Owner Flutter template"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.10+1
  geolocator: ^13.0.0
  google_fonts: ^6.2.1
  logger: ^2.5.0
  flutter_background_service: ^5.0.6
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.5.1
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
